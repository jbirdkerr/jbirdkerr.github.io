repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^metrics-worker/
      - id: ruff-format
        files: ^metrics-worker/

  - repo: local
    hooks:
      - id: test-metrics-worker
        name: test metrics-worker
        entry: env PYTHONPATH=metrics-worker python3 -m unittest discover -s metrics-worker/tests
        language: system
        pass_filenames: false
        files: ^metrics-worker/
        types: [python]
