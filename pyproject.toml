[project]
name = "jbirdkerr-monorepo"
version = "0.1.0"
description = "Monorepo for jbirdkerr.net projects and services"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # Line length managed by formatter
]

[tool.pytest.ini_options]
testpaths = ["apps/metrics-worker/tests", "scripts"]
pythonpath = ["apps/metrics-worker", "."]
