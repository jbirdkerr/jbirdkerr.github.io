repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/metrics-worker/|^scripts/
      - id: ruff-format
        files: ^apps/metrics-worker/|^scripts/

  - repo: local
    hooks:
      - id: test-metrics-worker
        name: test metrics-worker
        entry: env PYTHONPATH=apps/metrics-worker python3 -m unittest discover -s apps/metrics-worker/tests
        language: system
        pass_filenames: false
        files: ^apps/metrics-worker/
        types: [python]
      - id: test-scripts
        name: test scripts
        entry: env PYTHONPATH=. python3 -m unittest discover -s scripts -p "test_*.py"
        language: system
        pass_filenames: false
        files: ^scripts/
        types: [python]
