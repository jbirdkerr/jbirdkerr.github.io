<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <meta name="htmx-config" content='{"selfRequestsOnly":false}'>
    <title>jbirdkerr.net</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="fx-canvas"></canvas>
    <div class="stage" id="stage">
        <!-- Realistic Eyeball Layer (Behind the Photo) -->
        <div class="eyeball-socket" id="socket-left">
            <div class="iris" id="iris-left">
                <div class="pupil">
                    <div class="glint-primary"></div>
                    <div class="glint-secondary"></div>
                </div>
            </div>
        </div>
        <div class="eyeball-socket" id="socket-right">
            <div class="iris" id="iris-right">
                <div class="pupil">
                    <div class="glint-primary"></div>
                    <div class="glint-secondary"></div>
                </div>
            </div>
        </div>
        <img src="img/henrybeard.png" alt="Henry Beard" class="main-photo" id="photo" draggable="false">
        <!-- Interactive Hotspot over Henry's nose -->
        <div class="snoot-hotspot" id="snoot" title="Boop!"></div>
        <!-- Googly Eyes Overlay -->
        <div class="googly-eye" id="eye-left">
            <div class="eye-pupil" id="pupil-left">
                <div class="eye-glint"></div>
            </div>
        </div>
        <div class="googly-eye" id="eye-right">
            <div class="eye-pupil" id="pupil-right">
                <div class="eye-glint"></div>
            </div>
        </div>
        <!-- 8-Bit Pixel "Deal With It" Sunglasses (Human) -->
        <div class="sunglasses-container" id="sunglasses">
            <svg viewBox="0 0 100 24" class="sunglasses-svg" shape-rendering="crispEdges">
                <!-- Frame -->
                <path fill="#000000" d="
                    M 2,2  h 42 v 16 h -8 v 4 h -26 v -4 h -8 z
                    M 44,2 h 12 v 4  h -12 z
                    M 56,2 h 42 v 16 h -8 v 4 h -26 v -4 h -8 z
                "/>
                <!-- White Glint Pixels Left Lens -->
                <rect x="8"  y="4" width="4" height="4" fill="#ffffff" />
                <rect x="12" y="8" width="4" height="4" fill="#ffffff" />
                <rect x="16" y="12" width="4" height="4" fill="#ffffff" />
                <!-- White Glint Pixels Right Lens -->
                <rect x="62" y="4" width="4" height="4" fill="#ffffff" />
                <rect x="66" y="8" width="4" height="4" fill="#ffffff" />
                <rect x="70" y="12" width="4" height="4" fill="#ffffff" />
            </svg>
        </div>
    </div>
    <!-- Party Banner -->
    <div class="party-banner" id="party-banner">
        🎉 DEAL WITH IT • PARTY MODE 🎉
    </div>
    <!-- Metrics Toggle Button -->
    <button
        class="metrics-toggle"
        id="metrics-toggle"
        title="Open metrics dashboard">📊 Metrics</button>
    <!-- Credits Toggle Button -->
    <button
        class="metrics-toggle"
        id="credits-toggle"
        title="View credits">💳 Credits</button>
    <!-- Metrics Modal -->
    <div class="modal-overlay" id="metrics-modal">
        <div class="modal-content" id="modal-content">
            <button class="modal-close" title="Close">✕</button>
            <h2>🐶 BoopMaster 3000 Stats</h2>
            <div id="metrics-container" hx-swap="innerHTML">
                <div class="loading" id="metrics-loading">📊 Loading metrics...</div>
            </div>
        </div>
    </div>
    <!-- Credits Modal (stub for future use) -->
    <div class="modal-overlay" id="credits-modal">
        <div class="modal-content">
            <button class="modal-close" title="Close">✕</button>
            <h2>💳 Credits & Attribution</h2>
            <div style="padding: 12px 0;">
                <p style="margin-bottom: 12px; color: #aaa;">Built with:</p>
                <div style="font-size: 0.9rem; line-height: 1.8; color: #00d4ff;">
                    <div>🐶 Henry Beard (the good boy)</div>
                    <div>📊 <a href="https://posthog.com" style="color: #00d4ff;">PostHog</a> (analytics)</div>
                    <div>☁️ <a href="https://cloudflare.com" style="color: #00d4ff;">Cloudflare Workers</a> (infrastructure)</div>
                    <div>🌐 <a href="https://pages.github.com" style="color: #00d4ff;">GitHub Pages</a> (hosting)</div>
                    <div>🎯 <a href="https://htmx.org" style="color: #00d4ff;">HTMX</a> (interactions)</div>
                </div>
            </div>
        </div>
    </div>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org"></script>
    <!-- App -->
    <script src="js/main.js"></script>
</body>
</html>
