name = "jbirdkerr-metrics"
account_id = "1dcd86d2743bff3ea34323e58ee7470f"
workers_dev = true
compatibility_date = "2024-08-14"
compatibility_flags = ["python_workers"]
main = "./metrics-worker/worker.py"

[vars]
POSTHOG_PROJECT_ID = "566829"

# Top-level Durable Object binding (used for default/dev deploys)
[[durable_objects.bindings]]
name = "METRICS_CACHE"
class_name = "MetricsCache"

# Top-level SQLite migration for Free Plan support
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsCache"]

# Production environment configuration
[env.production]
name = "jbirdkerr-metrics"
routes = [
  { pattern = "metrics-api.jbirdkerr.net", custom_domain = true }
]

[env.production.vars]
POSTHOG_PROJECT_ID = "566829"

# Durable Object bindings must be explicitly listed under environments
[[env.production.durable_objects.bindings]]
name = "METRICS_CACHE"
class_name = "MetricsCache"

[observability.logs]
enabled = false
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false