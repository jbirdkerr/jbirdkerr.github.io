name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-metrics-worker:
    name: Lint & Test Metrics Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check metrics-worker/

      - name: Run Ruff Formatter Check
        run: ruff format --check metrics-worker/

      - name: Run Unit Tests
        run: PYTHONPATH=metrics-worker python -m unittest discover -s metrics-worker/tests
